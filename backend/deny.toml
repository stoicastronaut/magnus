[advisories]
db-path = "$HOME/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]

# Ignore known advisories that are transitive deps via Tauri but not fixable
# without major Tauri bumps. GTK3 bindings are unmaintained but required for
# Linux GUI support. UNIC crates are unmaintained but transitively required by
# tauri-utils. rand unsound edge case is not exploitable in our usage.
ignore = [
    "RUSTSEC-2024-0412", "RUSTSEC-2024-0413", "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415", "RUSTSEC-2024-0416", "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418", "RUSTSEC-2024-0419", "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429", "RUSTSEC-2024-0370",
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098", "RUSTSEC-2025-0100", "RUSTSEC-2025-0057",
    "RUSTSEC-2026-0097",
]

[bans]
multiple-versions = "warn"
